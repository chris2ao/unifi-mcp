name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run unit tests
        run: uv run pytest -q

      - name: Verify every auto-discovered tool module imports
        run: |
          uv run python -c "
          import importlib
          from unifi_mcp.tools._registry import PRODUCT_MODULES
          count = 0
          for product, modules in PRODUCT_MODULES.items():
              for m in modules:
                  importlib.import_module(f'unifi_mcp.tools.{product}.{m}')
                  count += 1
          print(f'All {count} tool modules import cleanly.')
          "

      - name: Check docs/TOOLS.md is up to date
        run: uv run python scripts/gen_tool_docs.py --check
